<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sugar Rush — Offline Match-3</title>
<style>
  :root{
    --bg-1: #2b1a4a;
    --bg-2: #4a2a6d;
    --panel: #ffffff;
    --ink: #3a2551;
    --ink-soft: #7a6a92;
    --accent: #ff5f96;
    --accent-2: #6b46c1;
    --gold: #ffc93c;
    --tile-bg: #f3effb;
    --tile-border: #ded4f2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ overscroll-behavior: none; }
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }

  .wrap{
    width:100%;
    max-width:520px;
  }

  .title{
    position:relative;
    text-align:center;
    margin: 0 0 14px 0;
    color:#fff;
  }
  .sound-toggle{
    position:absolute;
    top: -2px;
    right: 4px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background: rgba(255,255,255,0.14);
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .sound-toggle.muted{ opacity:0.55; }
  .title h1{
    margin:0;
    font-size: 2.1rem;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .title h1 span{ color: var(--gold); }
  .title p{
    margin: 4px 0 0 0;
    color: rgba(255,255,255,0.75);
    font-size: 0.9rem;
  }

  .hud{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .stat{
    flex:1;
    background: var(--panel);
    border-radius: 16px;
    padding: 10px 14px;
    text-align:center;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .stat .label{
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--ink-soft);
    font-weight:bold;
  }
  .stat .value{
    font-size:1.4rem;
    font-weight:bold;
    color: var(--accent-2);
  }
  .stat.moves .value{ color: var(--accent); }
  .stat.goal .value{ color: #2f9e44; }

  .board-shell{
    position:relative;
    background: var(--panel);
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.18);
  }

  .toast{
    position:absolute;
    left:50%;
    top:14px;
    transform: translate(-50%, -12px);
    background: var(--accent-2);
    color:#fff;
    font-weight:bold;
    font-size:0.85rem;
    padding:8px 16px;
    border-radius:999px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index:5;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform: translate(-50%, 0);
  }

  #board{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    aspect-ratio: 1 / 1;
    user-select:none;
    touch-action:none;
  }

  .tile{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--tile-bg);
    border: 2px solid var(--tile-border);
    border-radius: 12px;
    font-size: clamp(1.1rem, 3.6vw, 1.7rem);
    cursor:pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  @media (hover:hover){
    .tile:hover{ transform: translateY(-2px); }
  }
  .tile.selected{
    box-shadow: 0 0 0 3px var(--gold) inset;
    transform: scale(0.94);
  }
  .tile.falling{
    animation: drop 0.28s ease-out;
  }
  .tile.popping{
    animation: pop 0.28s ease-in forwards;
    pointer-events:none;
  }
  .tile.spawning{
    animation: spawn 0.28s ease-out;
  }
  .tile.hint{
    animation: wiggle 0.6s ease-in-out infinite;
  }

  @keyframes pop{
    0%{ transform: scale(1); opacity:1; }
    60%{ transform: scale(1.3); opacity:0.7; }
    100%{ transform: scale(0); opacity:0; }
  }
  @keyframes spawn{
    0%{ transform: translateY(-140%) scale(0.6); opacity:0; }
    100%{ transform: translateY(0) scale(1); opacity:1; }
  }
  @keyframes drop{
    0%{ transform: translateY(-30%); }
    100%{ transform: translateY(0); }
  }
  @keyframes wiggle{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-6deg); }
    75%{ transform: rotate(6deg); }
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  button.action{
    flex:1;
    border:none;
    border-radius:14px;
    padding:12px;
    min-height:48px;
    font-size:1rem;
    font-weight:bold;
    font-family:inherit;
    color:#fff;
    background: var(--accent-2);
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  button.action:active{ transform: translateY(3px); box-shadow:none; }
  button.action.secondary{ background: var(--accent); }

  .overlay{
    position:fixed;
    inset:0;
    background: rgba(20,10,35,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff;
    border-radius:20px;
    padding:28px 26px;
    text-align:center;
    max-width:340px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.2);
  }
  .modal h2{ margin:0 0 8px 0; color: var(--accent-2); }
  .modal p{ margin:0 0 18px 0; color: var(--ink-soft); }

  footer{
    text-align:center;
    color: rgba(255,255,255,0.5);
    font-size:0.75rem;
    margin-top:14px;
  }

  @media (max-width: 380px){
    body{ padding: 12px; }
    .title h1{ font-size: 1.7rem; }
    .title p{ font-size: 0.8rem; }
    .stat{ padding: 8px 6px; }
    .stat .label{ font-size: 0.6rem; }
    .stat .value{ font-size: 1.15rem; }
    .board-shell{ padding: 8px; }
    #board{ gap: 4px; }
    .tile{ border-radius: 9px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="title">
      <button id="soundBtn" class="sound-toggle" aria-label="Toggle sound" title="Toggle sound">🔊</button>
      <h1>Sugar <span>Rush</span></h1>
      <p>Swap neighboring candies to line up 3 or more. Fully offline, no install needed.</p>
    </div>

    <div class="hud">
      <div class="stat">
        <div class="label">Score</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat moves">
        <div class="label">Moves left</div>
        <div class="value" id="movesVal">25</div>
      </div>
      <div class="stat goal">
        <div class="label">Goal</div>
        <div class="value" id="goalVal">1200</div>
      </div>
    </div>

    <div class="board-shell">
      <div id="board"></div>
      <div id="toast" class="toast"></div>
    </div>

    <div class="controls">
      <button class="action secondary" id="hintBtn">Hint</button>
      <button class="action" id="restartBtn">Restart</button>
    </div>

    <footer>Level goal increases each time you win. Progress is not saved between sessions.</footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Level Complete!</h2>
      <p id="modalText">Sweet! You hit the score goal.</p>
      <button class="action" id="modalBtn">Next Level</button>
    </div>
  </div>

<script>
(function(){
  const SIZE = 8;
  const CANDIES = ['🍬','🍭','🍫','🍩','🍪','🧁'];
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('scoreVal');
  const movesEl = document.getElementById('movesVal');
  const goalEl = document.getElementById('goalVal');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalBtn = document.getElementById('modalBtn');
  const hintBtn = document.getElementById('hintBtn');
  const restartBtn = document.getElementById('restartBtn');
  const soundBtn = document.getElementById('soundBtn');
  const toastEl = document.getElementById('toast');

  let grid = [];
  let score = 0;
  let moves = 25;
  let goal = 1200;
  let level = 1;
  let selected = null;
  let busy = false;

  // --- Sound engine ---------------------------------------------------------
  // All sounds are synthesized on the fly with the Web Audio API, so nothing
  // needs to be downloaded — the game stays 100% offline with sound included.
  let audioCtx = null;
  let muted = false;

  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Play a single tone. type: 'sine'|'triangle'|'square'|'sawtooth'
  function tone(freq, startOffset, duration, {type='sine', gain=0.2, glideTo=null} = {}){
    if(muted) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + startOffset;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo){
      osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
    }
    amp.gain.setValueAtTime(0, t0);
    amp.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  // A brief burst of filtered noise, used for the "invalid move" buzz.
  function noiseBuzz(startOffset, duration, freq){
    if(muted) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + startOffset;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2 - 1) * 0.6; }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = freq;
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.16, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter).connect(amp).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + duration);
  }

  const SFX = {
    // Cheerful little "get set" chime played at the start of a level.
    ready(){
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        tone(f, i * 0.09, 0.22, {type:'triangle', gain:0.16});
      });
    },
    // Soft click when two candies are swapped.
    swap(){
      tone(420, 0, 0.09, {type:'sine', gain:0.12, glideTo:520});
    },
    // Low buzz when a swap doesn't make a match.
    invalid(){
      noiseBuzz(0, 0.14, 500);
      tone(160, 0, 0.14, {type:'square', gain:0.06});
    },
    // Candy pop, pitch rises with combo/streak so cascades feel escalating.
    pop(comboLevel){
      const base = 660 + Math.min(comboLevel, 6) * 90;
      tone(base, 0, 0.16, {type:'triangle', gain:0.18, glideTo: base * 1.6});
      tone(base * 1.5, 0.02, 0.12, {type:'sine', gain:0.09});
    },
    // Triumphant little fanfare for level-complete.
    win(){
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, i) => tone(f, i * 0.11, 0.30, {type:'triangle', gain:0.18}));
      notes.forEach((f, i) => tone(f*2, i * 0.11 + 0.02, 0.18, {type:'sine', gain:0.05}));
    },
    // Gentle descending tone for out-of-moves.
    lose(){
      [440, 349.23, 293.66].forEach((f, i) => {
        tone(f, i * 0.16, 0.28, {type:'sawtooth', gain:0.1});
      });
    },
    // Quick magical whoosh when the board auto-reshuffles.
    shuffle(){
      tone(300, 0, 0.28, {type:'sine', gain:0.12, glideTo:900});
      tone(450, 0.05, 0.22, {type:'triangle', gain:0.08, glideTo:1200});
    }
  };

  function updateSoundBtn(){
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.classList.toggle('muted', muted);
  }

  soundBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    updateSoundBtn();
    if(!muted) SFX.swap();
  });


  function randCandy(){
    return CANDIES[Math.floor(Math.random() * CANDIES.length)];
  }

  function idx(r,c){ return r*SIZE + c; }

  function buildInitialGrid(){
    let g;
    do {
      g = [];
      for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
          let candy;
          let tries=0;
          do{
            candy = randCandy();
            tries++;
          } while(
            tries < 20 && (
              (c>=2 && g[idx(r,c-1)]===candy && g[idx(r,c-2)]===candy) ||
              (r>=2 && g[idx(r-1,c)]===candy && g[idx(r-2,c)]===candy)
            )
          );
          g[idx(r,c)] = candy;
        }
      }
    } while(findMatches(g).size > 0 || !hasAnyMove(g));
    return g;
  }

  function render(){
    boardEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const el = document.createElement('div');
        el.className = 'tile';
        el.textContent = grid[idx(r,c)] || '';
        el.dataset.r = r;
        el.dataset.c = c;
        el.addEventListener('click', onTileClick);
        boardEl.appendChild(el);
      }
    }
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    goalEl.textContent = goal;
  }

  function getTileEl(r,c){
    return boardEl.children[idx(r,c)];
  }

  function onTileClick(e){
    if(busy) return;
    // Skip synthetic click that follows a handled swipe gesture.
    if(e.__fromSwipe) return;
    const r = parseInt(e.currentTarget.dataset.r);
    const c = parseInt(e.currentTarget.dataset.c);

    if(!selected){
      selected = {r,c};
      e.currentTarget.classList.add('selected');
      return;
    }

    const isAdjacent = Math.abs(selected.r - r) + Math.abs(selected.c - c) === 1;

    if(selected.r === r && selected.c === c){
      e.currentTarget.classList.remove('selected');
      selected = null;
      return;
    }

    if(isAdjacent){
      attemptSwap(selected, {r,c});
      clearSelection();
    } else {
      clearSelection();
      selected = {r,c};
      e.currentTarget.classList.add('selected');
    }
  }

  // --- Touch swipe support -------------------------------------------------
  // Lets a player drag a candy toward a neighbor instead of tapping twice.
  let touchStart = null; // {r, c, x, y}
  const SWIPE_THRESHOLD = 18; // px, small so short flicks on small screens register

  boardEl.addEventListener('touchstart', (e) => {
    if(busy) return;
    const t = e.target.closest('.tile');
    if(!t) return;
    const touch = e.changedTouches[0];
    touchStart = {
      r: parseInt(t.dataset.r),
      c: parseInt(t.dataset.c),
      x: touch.clientX,
      y: touch.clientY
    };
  }, {passive:true});

  boardEl.addEventListener('touchend', (e) => {
    if(busy || !touchStart) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStart.x;
    const dy = touch.clientY - touchStart.y;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    if(Math.max(absX, absY) < SWIPE_THRESHOLD){
      // Too small to count as a swipe; let the click handler treat it as a tap.
      touchStart = null;
      return;
    }

    let target = null;
    if(absX > absY){
      target = { r: touchStart.r, c: touchStart.c + (dx > 0 ? 1 : -1) };
    } else {
      target = { r: touchStart.r + (dy > 0 ? 1 : -1), c: touchStart.c };
    }

    if(target.r >= 0 && target.r < SIZE && target.c >= 0 && target.c < SIZE){
      clearSelection();
      e.preventDefault();
      attemptSwap({r: touchStart.r, c: touchStart.c}, target);
      // Mark the resulting synthetic click (mobile browsers fire one after touchend)
      // so onTileClick doesn't also treat it as a fresh tap-to-select.
      const el = getTileEl(touchStart.r, touchStart.c);
      if(el){
        const suppressClick = (ce) => { ce.__fromSwipe = true; };
        el.addEventListener('click', suppressClick, {once:true, capture:true});
        setTimeout(() => el.removeEventListener('click', suppressClick, {capture:true}), 400);
      }
    }
    touchStart = null;
  }, {passive:false});

  function clearSelection(){
    const sel = boardEl.querySelector('.selected');
    if(sel) sel.classList.remove('selected');
    selected = null;
  }

  function swapCells(a,b){
    const tmp = grid[idx(a.r,a.c)];
    grid[idx(a.r,a.c)] = grid[idx(b.r,b.c)];
    grid[idx(b.r,b.c)] = tmp;
  }

  async function attemptSwap(a,b){
    if(moves <= 0) return;
    busy = true;
    swapCells(a,b);

    const matches = findMatches(grid);
    if(matches.size === 0){
      // invalid move: swap back with a little shake feel
      SFX.invalid();
      await wait(120);
      swapCells(a,b);
      render();
      busy = false;
      return;
    }

    SFX.swap();
    moves--;
    render();
    await wait(80);
    await resolveMatches();
    await autoReshuffleIfStuck();
    busy = false;

    if(moves <= 0 && score < goal){
      endGame(false);
    }
  }

  function findMatches(g){
    const matched = new Set();
    for(let r=0;r<SIZE;r++){
      let runStart = 0;
      for(let c=1;c<=SIZE;c++){
        if(c<SIZE && g[idx(r,c)] === g[idx(r,runStart)] && g[idx(r,c)] != null){
          continue;
        }
        const runLen = c - runStart;
        if(runLen >= 3){
          for(let k=runStart;k<c;k++) matched.add(idx(r,k));
        }
        runStart = c;
      }
    }
    for(let c=0;c<SIZE;c++){
      let runStart = 0;
      for(let r=1;r<=SIZE;r++){
        if(r<SIZE && g[idx(r,c)] === g[idx(runStart,c)] && g[idx(r,c)] != null){
          continue;
        }
        const runLen = r - runStart;
        if(runLen >= 3){
          for(let k=runStart;k<r;k++) matched.add(idx(k,c));
        }
        runStart = r;
      }
    }
    return matched;
  }

  async function resolveMatches(){
    let combo = 0;
    while(true){
      const matched = findMatches(grid);
      if(matched.size === 0) break;
      combo++;

      matched.forEach(i => {
        const el = boardEl.children[i];
        if(el) el.classList.add('popping');
      });
      SFX.pop(combo);
      score += matched.size * 10 * combo;
      updateHud();
      await wait(220);

      matched.forEach(i => { grid[i] = null; });
      collapseColumns();
      render();
      await wait(160);
    }

    if(score >= goal){
      endGame(true);
    }
  }

  function collapseColumns(){
    for(let c=0;c<SIZE;c++){
      let write = SIZE - 1;
      for(let r=SIZE-1;r>=0;r--){
        if(grid[idx(r,c)] != null){
          grid[idx(write,c)] = grid[idx(r,c)];
          if(write !== r) grid[idx(r,c)] = null;
          write--;
        }
      }
      for(let r=write;r>=0;r--){
        grid[idx(r,c)] = randCandy();
      }
    }
  }

  function hasAnyMove(g){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(c<SIZE-1){
          [grid_swap(g,r,c,r,c+1)];
          if(findMatches(g).size>0){ grid_swap(g,r,c,r,c+1); return true; }
          grid_swap(g,r,c,r,c+1);
        }
        if(r<SIZE-1){
          grid_swap(g,r,c,r+1,c);
          if(findMatches(g).size>0){ grid_swap(g,r,c,r+1,c); return true; }
          grid_swap(g,r,c,r+1,c);
        }
      }
    }
    return false;
  }
  function grid_swap(g,r1,c1,r2,c2){
    const t = g[idx(r1,c1)];
    g[idx(r1,c1)] = g[idx(r2,c2)];
    g[idx(r2,c2)] = t;
  }

  function findHint(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(c<SIZE-1){
          grid_swap(grid,r,c,r,c+1);
          const m = findMatches(grid);
          grid_swap(grid,r,c,r,c+1);
          if(m.size>0) return [{r,c},{r,c:c+1}];
        }
        if(r<SIZE-1){
          grid_swap(grid,r,c,r+1,c);
          const m = findMatches(grid);
          grid_swap(grid,r,c,r+1,c);
          if(m.size>0) return [{r,c},{r:r+1,c}];
        }
      }
    }
    return null;
  }

  let toastTimer = null;
  function showToast(msg, duration = 1600){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  hintBtn.addEventListener('click', async () => {
    if(busy) return;
    const h = findHint();
    if(!h){
      await autoReshuffleIfStuck(true);
      return;
    }
    h.forEach(({r,c}) => {
      const el = getTileEl(r,c);
      el.classList.add('hint');
      setTimeout(() => el.classList.remove('hint'), 1200);
    });
  });

  // Checks whether any legal move exists; if not, reshuffles the whole board
  // in place (keeping score/moves/level) with a toast + sound + animation.
  // Called automatically after every cascade settles, and also usable from
  // the Hint button when it can't find a move.
  async function autoReshuffleIfStuck(forced = false){
    if(hasAnyMove(grid)) return false;
    busy = true;
    SFX.shuffle();
    showToast('No more moves — reshuffling! 🔀');
    // brief pause so the message registers before the board changes
    await wait(500);
    grid = buildInitialGrid();
    render();
    const tiles = boardEl.querySelectorAll('.tile');
    tiles.forEach(t => t.classList.add('spawning'));
    await wait(300);
    tiles.forEach(t => t.classList.remove('spawning'));
    busy = false;
    return true;
  }

  function wait(ms){ return new Promise(res => setTimeout(res, ms)); }

  function endGame(won){
    busy = true;
    if(won){
      SFX.win();
      modalTitle.textContent = 'Level Complete!';
      modalText.textContent = `Sweet! You scored ${score} and hit the goal of ${goal}.`;
      modalBtn.textContent = 'Next Level';
    } else {
      SFX.lose();
      modalTitle.textContent = 'Out of Moves';
      modalText.textContent = `You reached ${score} points. The goal was ${goal}. Try again!`;
      modalBtn.textContent = 'Retry Level';
    }
    overlay.classList.add('show');
    modalBtn.onclick = () => {
      overlay.classList.remove('show');
      if(won){
        level++;
        goal = Math.round(goal * 1.35);
        score = 0;
        moves = 25;
      } else {
        score = 0;
        moves = 25;
      }
      grid = buildInitialGrid();
      render();
      busy = false;
      SFX.ready();
    };
  }

  restartBtn.addEventListener('click', () => {
    if(!confirm('Restart the current level? Your score for this level will reset.')) return;
    score = 0;
    moves = 25;
    grid = buildInitialGrid();
    render();
    busy = false;
    SFX.ready();
  });

  // init
  grid = buildInitialGrid();
  render();
  autoReshuffleIfStuck();
  updateSoundBtn();
  // Sound needs a user gesture to start in most mobile browsers, so we prime
  // the audio context (and play the ready chime) on the very first tap/click
  // anywhere on the page, rather than trying to autoplay on load.
  function primeAudioOnce(){
    ensureAudio();
    SFX.ready();
    document.removeEventListener('pointerdown', primeAudioOnce);
  }
  document.addEventListener('pointerdown', primeAudioOnce, {once:true});
})();
</script>
</body>
</html>
