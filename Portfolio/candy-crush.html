<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sugar Rush — Match-3 Saga</title>
<style>
  :root{
    --bg-1: #2b1a4a;
    --bg-2: #4a2a6d;
    --panel: #ffffff;
    --ink: #3a2551;
    --ink-soft: #7a6a92;
    --accent: #ff5f96;
    --accent-2: #6b46c1;
    --gold: #ffc93c;
    --gold-dark: #d99a1a;
    --tile-bg: #f3effb;
    --tile-border: #ded4f2;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ overscroll-behavior: none; }
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
  }

  .app{
    width:100%;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: max(10px, var(--safe-t)) 10px max(10px, var(--safe-b));
  }

  .wrap{
    width:100%;
    max-width:560px;
  }

  .screen.hidden{ display:none; }

  /* ---------- Shared title bar ---------- */
  .title{
    position:relative;
    text-align:center;
    margin: 0 0 14px 0;
    color:#fff;
  }
  .icon-circle{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background: rgba(255,255,255,0.14);
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    transition: transform 0.12s ease;
  }
  .icon-circle:active{ transform: scale(0.88); }
  .icon-circle.muted{ opacity:0.55; }
  .sound-toggle{ position:absolute; top:-2px; right:4px; }
  .back-btn{ position:absolute; top:-2px; left:4px; font-size:1.3rem; }
  .top-right-icons{
    position:absolute;
    top:-2px;
    right:4px;
    display:flex;
    gap:8px;
  }
  .title h1{
    margin:0;
    font-size: 2.1rem;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .title h1 span{ color: var(--gold); }
  .title p{
    margin: 4px 0 0 0;
    color: rgba(255,255,255,0.75);
    font-size: 0.85rem;
  }

  /* ---------- Level map ---------- */
  .map-scroll{
    max-height: 72dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 22px;
    background: rgba(255,255,255,0.06);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    padding: 26px 0;
  }
  #levelPath{
    position:relative;
    min-height: 200px;
    padding: 0 10%;
  }
  #levelPath svg.path-line{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .level-node-row{
    position:relative;
    display:flex;
    margin-bottom: 34px;
    z-index:1;
  }
  .level-node-row.pos-1{ justify-content: flex-start; }
  .level-node-row.pos-2{ justify-content: center; }
  .level-node-row.pos-3{ justify-content: flex-end; }
  .level-node{
    border:none;
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-weight:bold;
    font-size:1.1rem;
    color:#fff;
    background: radial-gradient(circle at 32% 28%, #ff8fb3, var(--accent) 60%, #d63d78 100%);
    box-shadow: 0 6px 0 #b93465, inset 0 2px 3px rgba(255,255,255,0.5);
    cursor:pointer;
    position:relative;
    -webkit-user-select:none;
    user-select:none;
  }
  .level-node:active{ transform: translateY(3px); box-shadow: 0 3px 0 #b93465, inset 0 2px 3px rgba(255,255,255,0.5); }
  .level-node.current{
    background: radial-gradient(circle at 32% 28%, #ffe792, var(--gold) 60%, var(--gold-dark) 100%);
    box-shadow: 0 6px 0 #a9740f, inset 0 2px 3px rgba(255,255,255,0.6);
    color: #5a3a00;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .level-node.locked{
    background: linear-gradient(160deg, #b9aecb, #8b7fa3);
    box-shadow: 0 6px 0 #6a5f80, inset 0 2px 3px rgba(255,255,255,0.3);
    cursor:default;
    color: rgba(255,255,255,0.7);
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.08); }
  }
  .level-node .stars{
    position:absolute;
    bottom:-14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:1px;
    font-size:0.7rem;
    white-space:nowrap;
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  .level-node .stars .on{ color: var(--gold); }
  .level-node .stars .off{ color: rgba(255,255,255,0.35); }
  .level-node .lock-icon{ font-size:1.3rem; }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .stat{
    flex:1;
    background: var(--panel);
    border-radius: 16px;
    padding: 10px 14px;
    text-align:center;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .stat .label{
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--ink-soft);
    font-weight:bold;
  }
  .stat .value{
    font-size:1.4rem;
    font-weight:bold;
    color: var(--accent-2);
  }
  .stat.moves .value{ color: var(--accent); }
  .stat.goal .value{ color: #2f9e44; }

  .board-shell{
    position:relative;
    background: var(--panel);
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.18);
  }
  .board-shell.shake{ animation: shakeAnim 0.35s ease; }
  @keyframes shakeAnim{
    0%,100%{ transform: translate(0,0); }
    20%{ transform: translate(-6px,2px) rotate(-0.6deg); }
    40%{ transform: translate(5px,-3px) rotate(0.6deg); }
    60%{ transform: translate(-4px,3px) rotate(-0.4deg); }
    80%{ transform: translate(3px,-2px) rotate(0.4deg); }
  }

  .toast{
    position:absolute;
    left:50%;
    top:14px;
    transform: translate(-50%, -12px);
    background: var(--accent-2);
    color:#fff;
    font-weight:bold;
    font-size:0.85rem;
    padding:8px 16px;
    border-radius:999px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index:5;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform: translate(-50%, 0);
  }

  .combo-splash{
    position:absolute;
    left:50%;
    top:50%;
    transform: translate(-50%,-50%) scale(0);
    font-size: clamp(1.8rem, 9vw, 3rem);
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    background: linear-gradient(135deg, var(--gold), var(--accent) 60%, var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,0.95);
    filter: drop-shadow(0 4px 2px rgba(0,0,0,0.25));
    pointer-events:none;
    z-index:21;
    opacity:0;
    white-space:nowrap;
    text-align:center;
  }
  .combo-splash.show{
    animation: comboPop 0.9s cubic-bezier(.34,1.6,.64,1) forwards;
  }
  @keyframes comboPop{
    0%{ transform: translate(-50%,-50%) scale(0.3) rotate(-8deg); opacity:0; }
    32%{ transform: translate(-50%,-50%) scale(1.3) rotate(4deg); opacity:1; }
    50%{ transform: translate(-50%,-50%) scale(1) rotate(-2deg); opacity:1; }
    78%{ transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
    100%{ transform: translate(-50%,-50%) scale(0.85) rotate(0deg); opacity:0; }
  }

  #board{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    aspect-ratio: 1 / 1;
    user-select:none;
    touch-action:none;
  }

  .tile{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--tile-bg);
    border: 2px solid var(--tile-border);
    border-radius: 12px;
    cursor:pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    overflow:hidden;
  }
  @media (hover:hover){
    .tile:hover .candy{ transform: translateY(-2px) scale(1.02); }
  }
  .tile.selected{
    box-shadow: 0 0 0 3px var(--gold) inset;
    background: #fff3d6;
  }
  .tile.falling .candy{
    animation: drop 0.30s cubic-bezier(.5,1.6,.6,1);
  }
  .tile.popping .candy{
    animation: pop 0.26s ease-in forwards;
    pointer-events:none;
  }
  .tile.spawning .candy{
    animation: spawn 0.32s cubic-bezier(.34,1.4,.64,1);
  }
  .tile.hint .candy{
    animation: wiggle 0.6s ease-in-out infinite;
  }

  @keyframes pop{
    0%{ transform: scale(1) rotate(0); opacity:1; }
    55%{ transform: scale(1.35) rotate(8deg); opacity:0.8; }
    100%{ transform: scale(0) rotate(20deg); opacity:0; }
  }
  @keyframes spawn{
    0%{ transform: translateY(-160%) scale(0.5); opacity:0; }
    70%{ transform: translateY(6%) scale(1.06); opacity:1; }
    100%{ transform: translateY(0) scale(1); opacity:1; }
  }
  @keyframes drop{
    0%{ transform: translateY(-30%); }
    60%{ transform: translateY(4%); }
    100%{ transform: translateY(0); }
  }
  @keyframes wiggle{
    0%,100%{ transform: rotate(0deg) scale(1); }
    25%{ transform: rotate(-8deg) scale(1.05); }
    75%{ transform: rotate(8deg) scale(1.05); }
  }

  /* ---------- Glossy 3D candy ---------- */
  .candy{
    position:relative;
    width: 76%;
    height: 76%;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.15s ease;
  }
  .candy::before{
    /* glossy highlight sweep */
    content:'';
    position:absolute;
    top:8%; left:14%;
    width:38%; height:28%;
    background: rgba(255,255,255,0.75);
    border-radius:50%;
    filter: blur(1px);
    transform: rotate(-18deg);
  }
  .candy .emoji{
    font-size: clamp(1.05rem, 4.6vw, 1.7rem);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
    position:relative;
    z-index:1;
  }
  .candy-r{ background: radial-gradient(circle at 32% 28%, #ff9eb5, #ff5f7a 55%, #c21f3d 100%); box-shadow: 0 3px 0 #9c1730, inset 0 -4px 6px rgba(0,0,0,0.25); }
  .candy-o{ background: radial-gradient(circle at 32% 28%, #ffcf8f, #ff9a3c 55%, #d9660d 100%); box-shadow: 0 3px 0 #a84e08, inset 0 -4px 6px rgba(0,0,0,0.22); }
  .candy-y{ background: radial-gradient(circle at 32% 28%, #fff6ad, #ffd93c 55%, #d4a300 100%); box-shadow: 0 3px 0 #a67e00, inset 0 -4px 6px rgba(0,0,0,0.2); }
  .candy-g{ background: radial-gradient(circle at 32% 28%, #bdf7b0, #5fd15a 55%, #248a2f 100%); box-shadow: 0 3px 0 #196b21, inset 0 -4px 6px rgba(0,0,0,0.22); }
  .candy-b{ background: radial-gradient(circle at 32% 28%, #b6ddff, #4fa3ff 55%, #1660c2 100%); box-shadow: 0 3px 0 #0f4796, inset 0 -4px 6px rgba(0,0,0,0.25); }
  .candy-p{ background: radial-gradient(circle at 32% 28%, #e3c1ff, #a855e8 55%, #6c1fa8 100%); box-shadow: 0 3px 0 #4f1680, inset 0 -4px 6px rgba(0,0,0,0.25); }

  /* Striped specials: colored bands + soft pulsing glow */
  .candy.special-stripeH, .candy.special-stripeV{
    animation: specialGlow 1.4s ease-in-out infinite;
  }
  .candy.special-stripeH::after, .candy.special-stripeV::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.85) 0 14%,
      transparent 14% 28%
    );
    mix-blend-mode: overlay;
  }
  .candy.special-stripeV::after{
    background: repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.85) 0 14%,
      transparent 14% 28%
    );
  }

  /* Wrapped special: foil cross-hatch + gold ring */
  .candy.special-wrap{
    box-shadow: 0 3px 0 var(--gold-dark), inset 0 -4px 6px rgba(0,0,0,0.22), 0 0 0 3px var(--gold);
    animation: specialGlow 1.4s ease-in-out infinite;
  }
  .candy.special-wrap::after{
    content:'✦';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.7em;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }

  @keyframes specialGlow{
    0%,100%{ filter: brightness(1); }
    50%{ filter: brightness(1.25); }
  }

  /* Color bomb: rainbow disco sphere */
  .candy.special-bomb{
    background: conic-gradient(from 0deg, #ff5f7a, #ff9a3c, #ffd93c, #5fd15a, #4fa3ff, #a855e8, #ff5f7a);
    box-shadow: 0 3px 0 #3a2551, inset 0 -4px 6px rgba(0,0,0,0.25), 0 0 12px 2px rgba(255,255,255,0.5);
    animation: bombSpin 2.2s linear infinite, specialGlow 1s ease-in-out infinite;
  }
  .candy.special-bomb .emoji{ display:none; }
  @keyframes bombSpin{
    0%{ background-position: 0 0; filter: hue-rotate(0deg); }
    100%{ filter: hue-rotate(360deg); }
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  button.action{
    flex:1;
    border:none;
    border-radius:14px;
    padding:12px;
    min-height:48px;
    font-size:1rem;
    font-weight:bold;
    font-family:inherit;
    color:#fff;
    background: var(--accent-2);
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  button.action:active{ transform: translateY(3px); box-shadow:none; }
  button.action.secondary{ background: var(--accent); }

  .overlay{
    position:fixed;
    inset:0;
    background: rgba(20,10,35,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
    padding: 20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff;
    border-radius:20px;
    padding:28px 26px;
    text-align:center;
    max-width:340px;
    width:100%;
    box-shadow: 0 12px 0 rgba(0,0,0,0.2);
  }
  .modal h2{ margin:0 0 8px 0; color: var(--accent-2); }
  .modal p{ margin:0 0 10px 0; color: var(--ink-soft); }
  .modal .big-stars{
    font-size: 2.2rem;
    margin: 6px 0 16px 0;
    letter-spacing: 4px;
  }
  .modal .big-stars .off{ color: #e4dcf2; }
  .modal .big-stars .on{
    color: var(--gold);
    text-shadow: 0 2px 2px rgba(0,0,0,0.2);
    display:inline-block;
    animation: starPop 0.5s cubic-bezier(.34,1.6,.64,1) both;
  }
  .modal .big-stars .on:nth-child(1){ animation-delay: 0.1s; }
  .modal .big-stars .on:nth-child(2){ animation-delay: 0.25s; }
  .modal .big-stars .on:nth-child(3){ animation-delay: 0.4s; }
  @keyframes starPop{
    0%{ transform: scale(0) rotate(-40deg); opacity:0; }
    70%{ transform: scale(1.3) rotate(8deg); opacity:1; }
    100%{ transform: scale(1) rotate(0); opacity:1; }
  }
  .modal.celebrate{ animation: modalBounce 0.5s cubic-bezier(.34,1.5,.64,1) both; }
  @keyframes modalBounce{
    0%{ transform: scale(0.4) translateY(40px); opacity:0; }
    60%{ transform: scale(1.06) translateY(-6px); opacity:1; }
    100%{ transform: scale(1) translateY(0); opacity:1; }
  }
  .modal .modal-buttons{ display:flex; gap:10px; }

  footer{
    text-align:center;
    color: rgba(255,255,255,0.5);
    font-size:0.75rem;
    margin-top:14px;
  }

  @media (max-width: 480px){
    .app{ padding: max(6px, var(--safe-t)) 6px max(6px, var(--safe-b)); }
    .title h1{ font-size: 1.6rem; }
    .title p{ font-size: 0.78rem; }
    .stat{ padding: 8px 4px; }
    .stat .label{ font-size: 0.58rem; }
    .stat .value{ font-size: 1.1rem; }
    .board-shell{ padding: 5px; border-radius: 16px; }
    #board{ gap: 3px; }
    .tile{ border-radius: 8px; }
    .level-node{ width:56px; height:56px; font-size:1rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="wrap">

    <!-- ================= LEVEL MAP SCREEN ================= -->
    <div id="mapScreen" class="screen">
      <div class="title">
        <button id="mapSoundBtn" class="icon-circle sound-toggle" aria-label="Toggle sound" title="Toggle sound">🔊</button>
        <h1>Sugar <span>Rush</span></h1>
        <p>Tap a level to play.</p>
      </div>
      <div class="map-scroll" id="mapScroll">
        <div id="levelPath"></div>
      </div>
    </div>

    <!-- ================= GAME SCREEN ================= -->
    <div id="gameScreen" class="screen hidden">
      <div class="title">
        <button id="backBtn" class="icon-circle back-btn" aria-label="Back to map" title="Back to map">←</button>
        <h1 id="levelTitle">Level <span id="levelNum">1</span></h1>
        <div class="top-right-icons">
          <button id="restartBtn" class="icon-circle" aria-label="Restart level" title="Restart level">↻</button>
          <button id="soundBtn" class="icon-circle" aria-label="Toggle sound" title="Toggle sound">🔊</button>
        </div>
      </div>

      <div class="hud">
        <div class="stat">
          <div class="label">Score</div>
          <div class="value" id="scoreVal">0</div>
        </div>
        <div class="stat moves">
          <div class="label">Moves left</div>
          <div class="value" id="movesVal">25</div>
        </div>
        <div class="stat goal">
          <div class="label">Goal</div>
          <div class="value" id="goalVal">1200</div>
        </div>
      </div>

      <div class="board-shell">
        <div id="board"></div>
        <div id="toast" class="toast"></div>
        <div id="comboSplash" class="combo-splash"></div>
      </div>
    </div>

  </div>
</div>

<canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:20;"></canvas>

<div class="overlay" id="overlay">
  <div class="modal" id="modalCard">
    <h2 id="modalTitle">Level Complete!</h2>
    <div class="big-stars" id="modalStars"></div>
    <p id="modalText">Sweet! You hit the score goal.</p>
    <div class="modal-buttons">
      <button class="action secondary" id="modalMapBtn">Level Map</button>
      <button class="action" id="modalBtn">Next Level</button>
    </div>
  </div>
</div>

<script>
(function(){
  const SIZE = 8;
  const COLORS = ['r','o','y','g','b','p'];
  const EMOJI = { r:'🍓', o:'🍊', y:'🍋', g:'🍏', b:'🫐', p:'🍇' };
  const SAVE_KEY = 'sugarRushSave_v1';

  // ---------------- DOM ----------------
  const mapScreen = document.getElementById('mapScreen');
  const gameScreen = document.getElementById('gameScreen');
  const levelPathEl = document.getElementById('levelPath');
  const mapScroll = document.getElementById('mapScroll');
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('scoreVal');
  const movesEl = document.getElementById('movesVal');
  const goalEl = document.getElementById('goalVal');
  const levelNumEl = document.getElementById('levelNum');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalStars = document.getElementById('modalStars');
  const modalBtn = document.getElementById('modalBtn');
  const modalMapBtn = document.getElementById('modalMapBtn');
  const restartBtn = document.getElementById('restartBtn');
  const soundBtn = document.getElementById('soundBtn');
  const mapSoundBtn = document.getElementById('mapSoundBtn');
  const backBtn = document.getElementById('backBtn');
  const toastEl = document.getElementById('toast');

  // ---------------- Save data ----------------
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        return Object.assign({ unlockedLevel:1, stars:{}, bestScore:{}, muted:false }, parsed);
      }
    }catch(e){ /* ignore corrupt save */ }
    return { unlockedLevel:1, stars:{}, bestScore:{}, muted:false };
  }
  function persistSave(){

    const moves = 20 + Math.min(8, Math.floor((n-1)/3)) + (n % 5 === 0 ? 2 : 0);
    return { goal, moves };
  }
  function starsForScore(n, score){
    const cfg = levelConfig(n);
    if(score >= cfg.goal * 1.8) return 3;
    if(score >= cfg.goal * 1.35) return 2;
    if(score >= cfg.goal) return 1;

  // ---------------- Sound engine ----------------

  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();

  function pickFunVoice(){

    const preferred = voicesCache.find(v => /female|samantha|victoria|zira|karen|moira|tessa|serena|allison/i.test(v.name));

  function speak(text, {pitch=1.35, rate=1.05, volume=1} = {}){
    if(muted) return;

      const utter = new SpeechSynthesisUtterance(text);
      const v = pickFunVoice();
      if(v) utter.voice = v;
      utter.pitch = pitch;
      utter.rate = rate;
      utter.volume = volume;
      window.speechSynthesis.speak(utter);
    }catch(e){ /* speech synthesis unavailable in this browser */ }
  }

  function tone(freq, startOffset, duration, {type='sine', gain=0.2, glideTo=null} = {}){
    if(muted) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + startOffset;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
    amp.gain.setValueAtTime(0, t0);
    amp.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }
  function noiseBuzz(startOffset, duration, freq){
    if(muted) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + startOffset;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2 - 1) * 0.6; }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = freq;
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.16, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter).connect(amp).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + duration);
  }
  const COMBO_WORDS = { 2:'Sweet!', 3:'Tasty!', 4:'Delicious!', 5:'Divine!', 6:'Sugar Rush!' };
  const SFX = {

    swap(){ tone(420,0,0.09,{type:'sine',gain:0.12,glideTo:520}); },

      notes.forEach((f,i)=>tone(f*2,i*0.09+0.03,0.22,{type:'sine',gain:0.08}));

  function updateSoundIcons(){
    [soundBtn, mapSoundBtn].forEach(btn=>{
      btn.textContent = muted ? '🔇' : '🔊';
      btn.classList.toggle('muted', muted);
    });
  }
  function toggleMute(){
    ensureAudio();
    muted = !muted;
    save.muted = muted;
    persistSave();
    updateSoundIcons();
    if(muted && 'speechSynthesis' in window){ window.speechSynthesis.cancel(); }
    if(!muted) SFX.swap();
  }
  soundBtn.addEventListener('click', toggleMute);
  mapSoundBtn.addEventListener('click', toggleMute);

  // ---------------- Grid helpers ----------------
  // Each cell is either null (empty) or {color:'r', special:null|'stripeH'|'stripeV'|'wrap'|'bomb'}
  let grid = [];
  let score = 0, moves = 25, goal = 1200, currentLevel = 1;
  let selected = null, busy = false;

  function idx(r,c){ return r*SIZE + c; }
  function randColor(){ return COLORS[Math.floor(Math.random()*COLORS.length)]; }
  function newCell(color, special){ return { color: color || randColor(), special: special || null }; }

  function buildInitialGrid(){
    let g;
    let guard = 0;
    do {
      g = [];
      for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
          let color, tries=0;
          do{
            color = randColor();
            tries++;
          } while(
            tries < 20 && (
              (c>=2 && g[idx(r,c-1)] && g[idx(r,c-2)] && g[idx(r,c-1)].color===color && g[idx(r,c-2)].color===color) ||
              (r>=2 && g[idx(r-1,c)] && g[idx(r-2,c)] && g[idx(r-1,c)].color===color && g[idx(r-2,c)].color===color)
            )
          );
          g[idx(r,c)] = newCell(color, null);
        }
      }
      guard++;
    } while((findRawMatches(g).matchedSet.size > 0 || !hasAnyMove(g)) && guard < 50);
    return g;
  }

  // Finds row/col runs of length>=3 on a color-grid, returns matchedSet + specials to create.
  // swapAnchor: [idxA, idxB] of the player's swap this pass (used to place new special at swap point), or null for cascades.
  function findRawMatches(g, swapAnchor){
    const rowRuns = [], colRuns = [];
    for(let r=0;r<SIZE;r++){
      let start=0;
      for(let c=1;c<=SIZE;c++){
        const cur = c<SIZE ? g[idx(r,c)] : null;
        const startCell = g[idx(r,start)];
        if(c<SIZE && cur && startCell && cur.color===startCell.color){ continue; }
        const len = c-start;
        if(len>=3){
          const cells=[]; for(let k=start;k<c;k++) cells.push(idx(r,k));
          rowRuns.push({cells, dir:'row', r, cStart:start, cEnd:c-1, len});
        }
        start=c;
      }
    }
    for(let c=0;c<SIZE;c++){
      let start=0;
      for(let r=1;r<=SIZE;r++){
        const cur = r<SIZE ? g[idx(r,c)] : null;
        const startCell = g[idx(start,c)];
        if(r<SIZE && cur && startCell && cur.color===startCell.color){ continue; }
        const len = r-start;
        if(len>=3){
          const cells=[]; for(let k=start;k<r;k++) cells.push(idx(k,c));
          colRuns.push({cells, dir:'col', c, rStart:start, rEnd:r-1, len});
        }
        start=r;
      }
    }

    const matchedSet = new Set();
    rowRuns.forEach(rr=>rr.cells.forEach(i=>matchedSet.add(i)));
    colRuns.forEach(cc=>cc.cells.forEach(i=>matchedSet.add(i)));

    // Intersections -> wrapped candy
    const specials = new Map();
    const usedCells = new Set();
    for(const rr of rowRuns){
      if(rr.len < 3) continue;
      for(const cc of colRuns){
        if(cc.len < 3) continue;
        if(cc.c >= rr.cStart && cc.c <= rr.cEnd && rr.r >= cc.rStart && rr.r <= cc.rEnd){
          const shared = idx(rr.r, cc.c);
          if(!usedCells.has(shared)){
            specials.set(shared, 'wrap');
            usedCells.add(shared);
          }
        }
      }
    }

    function pickAnchor(cells){
      if(swapAnchor){
        for(const a of swapAnchor){ if(cells.includes(a) && !usedCells.has(a)) return a; }
      }
      const mid = cells[Math.floor(cells.length/2)];
      return usedCells.has(mid) ? cells.find(c=>!usedCells.has(c)) : mid;
    }

    for(const rr of rowRuns){
      if(rr.len >= 5){
        const a = pickAnchor(rr.cells);
        if(a!=null && !usedCells.has(a)){ specials.set(a,'bomb'); usedCells.add(a); }
      } else if(rr.len === 4){
        const a = pickAnchor(rr.cells);
        if(a!=null && !usedCells.has(a)){ specials.set(a,'stripeH'); usedCells.add(a); }
      }
    }
    for(const cc of colRuns){
      if(cc.len >= 5){
        const a = pickAnchor(cc.cells);
        if(a!=null && !usedCells.has(a)){ specials.set(a,'bomb'); usedCells.add(a); }
      } else if(cc.len === 4){
        const a = pickAnchor(cc.cells);
        if(a!=null && !usedCells.has(a)){ specials.set(a,'stripeV'); usedCells.add(a); }
      }
    }

    return { matchedSet, specials };
  }

  function specialArea(cellIdx, type){
    const r = Math.floor(cellIdx/SIZE), c = cellIdx % SIZE;
    const area = new Set();
    if(type === 'stripeH'){
      for(let cc=0; cc<SIZE; cc++) area.add(idx(r,cc));
    } else if(type === 'stripeV'){
      for(let rr=0; rr<SIZE; rr++) area.add(idx(rr,c));
    } else if(type === 'wrap'){
      for(let rr=r-1; rr<=r+1; rr++){
        for(let cc=c-1; cc<=c+1; cc++){
          if(rr>=0 && rr<SIZE && cc>=0 && cc<SIZE) area.add(idx(rr,cc));
        }
      }
    } else if(type === 'bomb'){
      // fallback if a bomb ever gets swept up passively: clear its row+col
      for(let cc=0; cc<SIZE; cc++) area.add(idx(r,cc));
      for(let rr=0; rr<SIZE; rr++) area.add(idx(rr,c));
    }
    return area;
  }

  function render(){
    boardEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell = grid[idx(r,c)];
        const el = document.createElement('div');
        el.className = 'tile';
        el.dataset.r = r;
        el.dataset.c = c;
        if(cell){
          const candy = document.createElement('div');
          candy.className = 'candy candy-' + cell.color + (cell.special ? ' special-' + cell.special : '');
          const span = document.createElement('span');
          span.className = 'emoji';
          span.textContent = EMOJI[cell.color];
          candy.appendChild(span);
          el.appendChild(candy);
        }
        el.addEventListener('click', onTileClick);
        boardEl.appendChild(el);
      }
    }
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = score;
    movesEl.textContent = Math.max(0, moves);
    goalEl.textContent = goal;
  }

  function getTileEl(r,c){ return boardEl.children[idx(r,c)]; }

  function onTileClick(e){
    if(busy) return;
    if(e.__fromSwipe) return;
    bumpIdle();
    const r = parseInt(e.currentTarget.dataset.r);
    const c = parseInt(e.currentTarget.dataset.c);

    if(!selected){
      selected = {r,c};
      e.currentTarget.classList.add('selected');
      return;
    }
    const isAdjacent = Math.abs(selected.r - r) + Math.abs(selected.c - c) === 1;
    if(selected.r === r && selected.c === c){
      e.currentTarget.classList.remove('selected');
      selected = null;
      return;
    }
    if(isAdjacent){
      attemptSwap(selected, {r,c});
      clearSelection();
    } else {
      clearSelection();
      selected = {r,c};
      e.currentTarget.classList.add('selected');
    }
  }

  // Touch swipe support
  let touchStart = null;
  const SWIPE_THRESHOLD = 18;
  boardEl.addEventListener('touchstart', (e) => {
    if(busy) return;
    const t = e.target.closest('.tile');
    if(!t) return;
    bumpIdle();
    const touch = e.changedTouches[0];
    touchStart = { r: parseInt(t.dataset.r), c: parseInt(t.dataset.c), x: touch.clientX, y: touch.clientY };
  }, {passive:true});

  boardEl.addEventListener('touchend', (e) => {
    if(busy || !touchStart) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStart.x;
    const dy = touch.clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if(Math.max(absX, absY) < SWIPE_THRESHOLD){ touchStart = null; return; }
    let target = null;
    if(absX > absY) target = { r: touchStart.r, c: touchStart.c + (dx > 0 ? 1 : -1) };
    else target = { r: touchStart.r + (dy > 0 ? 1 : -1), c: touchStart.c };
    if(target.r >= 0 && target.r < SIZE && target.c >= 0 && target.c < SIZE){
      clearSelection();
      e.preventDefault();
      attemptSwap({r: touchStart.r, c: touchStart.c}, target);
      const el = getTileEl(touchStart.r, touchStart.c);
      if(el){
        const suppressClick = (ce) => { ce.__fromSwipe = true; };
        el.addEventListener('click', suppressClick, {once:true, capture:true});
        setTimeout(() => el.removeEventListener('click', suppressClick, {capture:true}), 400);
      }
    }
    touchStart = null;
  }, {passive:false});

  function clearSelection(){
    const sel = boardEl.querySelector('.selected');
    if(sel) sel.classList.remove('selected');
    selected = null;
  }

  function swapCells(a,b){
    const tmp = grid[idx(a.r,a.c)];
    grid[idx(a.r,a.c)] = grid[idx(b.r,b.c)];
    grid[idx(b.r,b.c)] = tmp;
  }

  async function attemptSwap(a,b){
    if(moves <= 0 || busy) return;
    busy = true;
    const aIdx = idx(a.r,a.c), bIdx = idx(b.r,b.c);
    const cellA = grid[aIdx], cellB = grid[bIdx];

    // Special + special or special-bomb combos handled distinctly
    if(cellA && cellB && (cellA.special === 'bomb' || cellB.special === 'bomb')){
      swapCells(a,b);
      SFX.swap();
      moves--;
      render();
      await wait(80);
      await resolveBombSwap(aIdx, bIdx, cellA, cellB);
      await autoReshuffleIfStuck();
      busy = false;
      bumpIdle();
      checkEndOfMoves();
      return;
    }

    swapCells(a,b);
    const { matchedSet } = findRawMatches(grid, [aIdx,bIdx]);
    if(matchedSet.size === 0){
      SFX.invalid();
      await wait(120);
      swapCells(a,b);
      render();
      busy = false;
      bumpIdle();
      return;
    }
    SFX.swap();
    moves--;
    render();
    await wait(80);
    await resolveMatches([aIdx,bIdx]);
    await autoReshuffleIfStuck();
    busy = false;
    bumpIdle();
    checkEndOfMoves();
  }

  function checkEndOfMoves(){
    if(moves <= 0 && score < goal){
      endGame(false);
    }
  }

  async function resolveBombSwap(aIdx, bIdx, cellA, cellB){
    let clearSet = new Set();
    let comboBonus = 0;
    if(cellA.special === 'bomb' && cellB.special === 'bomb'){
      for(let i=0;i<SIZE*SIZE;i++) if(grid[i]) clearSet.add(i);
      comboBonus = 500;
    } else {
      const bombIdx = cellA.special === 'bomb' ? aIdx : bIdx;
      const otherIdx = bombIdx === aIdx ? bIdx : aIdx;
      const otherCell = grid[otherIdx];
      const targetColor = otherCell.color;
      for(let i=0;i<SIZE*SIZE;i++){
        if(grid[i] && grid[i].color === targetColor) clearSet.add(i);
      }
      clearSet.add(bombIdx);
      if(otherCell.special && otherCell.special !== 'bomb'){
        specialArea(otherIdx, otherCell.special).forEach(i=>clearSet.add(i));
        comboBonus = 250;
      }
    }
    SFX.bomb();
    shakeBoard();
    clearSet.forEach(i=>{ const el = boardEl.children[i]; if(el) el.classList.add('popping'); });
    score += clearSet.size * 12 + comboBonus;
    updateHud();
    await wait(260);
    clearSet.forEach(i=>{ grid[i] = null; });
    collapseColumns();
    render();
    await wait(180);
    await resolveMatches(null);
  }

  async function resolveMatches(swapAnchor){
    let combo = 0;
    let anchor = swapAnchor;
    while(true){
      const { matchedSet, specials } = findRawMatches(grid, anchor);
      anchor = null; // only use swap anchor on the very first pass
      if(matchedSet.size === 0) break;
      combo++;

      const clearSet = new Set(matchedSet);
      specials.forEach((type, i) => clearSet.delete(i)); // newly-created specials survive

      // Cascade: any pre-existing special candies caught in this match detonate too
      const queue = [];
      clearSet.forEach(i => {
        if(grid[i] && grid[i].special && !specials.has(i)) queue.push(i);
      });
      const visited = new Set();
      let hadSpecialActivation = false;
      while(queue.length){
        const i = queue.pop();
        if(visited.has(i)) continue;
        visited.add(i);
        hadSpecialActivation = true;
        specialArea(i, grid[i].special).forEach(a2 => {
          if(!clearSet.has(a2)){
            clearSet.add(a2);
            if(grid[a2] && grid[a2].special && !specials.has(a2) && !visited.has(a2)) queue.push(a2);
          }
        });
      }

      clearSet.forEach(i => { const el = boardEl.children[i]; if(el) el.classList.add('popping'); });
      if(specials.size){
        const firstType = specials.values().next().value;
        SFX.special(firstType);
        if(combo < 2){
          const specialWord = firstType === 'bomb' ? 'Color Bomb!' : (firstType === 'wrap' ? 'Wrapped!' : 'Striped!');
          showComboSplash(specialWord);
          speak(specialWord, {pitch:1.25, rate:1.05});
        }
      } else {
        SFX.pop(combo);
      }
      if(hadSpecialActivation){ SFX.bomb(); shakeBoard(); }
      if(combo >= 2 && COMBO_WORDS[Math.min(combo,6)]){
        const comboWord = COMBO_WORDS[Math.min(combo,6)];
        SFX.comboCallout(combo);
        showComboSplash(comboWord, 950);
        speak(comboWord, {pitch: 1.3 + Math.min(combo,6)*0.05, rate: 1.1});
      }

      score += clearSet.size * 10 * combo + specials.size * 40;
      updateHud();
      await wait(230);

      clearSet.forEach(i => { grid[i] = null; });
      specials.forEach((type, i) => {
        // the anchor cell might have been nulled by a bomb cascade race; guard it
        if(!grid[i]) grid[i] = newCell(matchColorAt(i) || randColor(), type);
        else grid[i].special = type;
      });
      collapseColumns();
      render();
      await wait(160);
    }

    if(score >= goal){
      endGame(true);
    }
  }

  // best-effort: recover a plausible color for a special anchor if it got cleared by a cascade
  function matchColorAt(){ return randColor(); }

  function collapseColumns(){
    for(let c=0;c<SIZE;c++){
      let write = SIZE - 1;
      for(let r=SIZE-1;r>=0;r--){
        if(grid[idx(r,c)] != null){
          grid[idx(write,c)] = grid[idx(r,c)];
          if(write !== r) grid[idx(r,c)] = null;
          write--;
        }
      }
      for(let r=write;r>=0;r--){
        grid[idx(r,c)] = newCell(randColor(), null);
      }
    }
  }

  function hasAnyMove(g){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(g[idx(r,c)] && g[idx(r,c)].special === 'bomb') return true;
        if(c<SIZE-1){
          gridSwapRaw(g,r,c,r,c+1);
          const hasMatch = findRawMatches(g).matchedSet.size>0;
          gridSwapRaw(g,r,c,r,c+1);
          if(hasMatch) return true;
        }
        if(r<SIZE-1){
          gridSwapRaw(g,r,c,r+1,c);
          const hasMatch = findRawMatches(g).matchedSet.size>0;
          gridSwapRaw(g,r,c,r+1,c);
          if(hasMatch) return true;
        }
      }
    }
    return false;
  }
  function gridSwapRaw(g,r1,c1,r2,c2){
    const t = g[idx(r1,c1)];
    g[idx(r1,c1)] = g[idx(r2,c2)];
    g[idx(r2,c2)] = t;
  }

  function findHint(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(grid[idx(r,c)] && grid[idx(r,c)].special === 'bomb') return [{r,c},{r,c}];
        if(c<SIZE-1){
          gridSwapRaw(grid,r,c,r,c+1);
          const m = findRawMatches(grid).matchedSet.size>0;
          gridSwapRaw(grid,r,c,r,c+1);
          if(m) return [{r,c},{r,c:c+1}];
        }
        if(r<SIZE-1){
          gridSwapRaw(grid,r,c,r+1,c);
          const m = findRawMatches(grid).matchedSet.size>0;
          gridSwapRaw(grid,r,c,r+1,c);
          if(m) return [{r,c},{r:r+1,c}];
        }
      }
    }
    return null;
  }

  const boardShellEl = document.querySelector('.board-shell');
  let shakeTimer = null;
  function shakeBoard(){
    if(!boardShellEl) return;
    boardShellEl.classList.remove('shake');
    void boardShellEl.offsetWidth; // restart animation
    boardShellEl.classList.add('shake');
    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(() => boardShellEl.classList.remove('shake'), 400);
  }

  // ---------------- Confetti celebration ----------------
  const confettiCanvas = document.getElementById('confettiCanvas');
  const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;
  const CONFETTI_COLORS = ['#ff5f7a','#ff9a3c','#ffd93c','#5fd15a','#4fa3ff','#a855e8','#ffc93c'];
  let confettiParticles = [];
  let confettiRAF = null;

  function resizeConfettiCanvas(){
    if(!confettiCanvas) return;
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfettiCanvas);
  resizeConfettiCanvas();

  function launchConfetti(big){
    if(!confettiCtx) return;
    resizeConfettiCanvas();
    const count = big ? 140 : 80;
    const w = confettiCanvas.width;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*w,
        y: -20 - Math.random()*200,
        vx: (Math.random()-0.5)*3,
        vy: 2 + Math.random()*3.5,
        size: 6 + Math.random()*7,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 180 + Math.random()*80
      });
    }
    if(!confettiRAF) confettiRAF = requestAnimationFrame(tickConfetti);
  }

  function tickConfetti(){
    if(!confettiCtx){ confettiRAF = null; return; }
    confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.03;
      p.rot += p.vrot;
      p.life++;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      confettiCtx.restore();
    });
    confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < confettiCanvas.height + 40);
    if(confettiParticles.length > 0){
      confettiRAF = requestAnimationFrame(tickConfetti);
    } else {
      confettiRAF = null;
      confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  let toastTimer = null;
  function showToast(msg, duration = 1600){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  const comboSplashEl = document.getElementById('comboSplash');
  let comboSplashTimer = null;
  function showComboSplash(msg, duration = 900){
    if(!comboSplashEl) return;
    comboSplashEl.textContent = msg;
    comboSplashEl.classList.remove('show');
    void comboSplashEl.offsetWidth; // restart animation
    comboSplashEl.classList.add('show');
    clearTimeout(comboSplashTimer);
    comboSplashTimer = setTimeout(() => comboSplashEl.classList.remove('show'), duration);
  }

  // ---------------- Auto-hint on idle (no button needed) ----------------
  const IDLE_DELAY = 5000;
  let idleTimer = null;
  function clearIdleHint(){
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  }
  function bumpIdle(){
    clearIdleHint();
    if(gameScreen.classList.contains('hidden')) return;
    idleTimer = setTimeout(triggerAutoHint, IDLE_DELAY);
  }
  async function triggerAutoHint(){
    if(busy || gameScreen.classList.contains('hidden')) return;
    const h = findHint();
    if(!h){
      await autoReshuffleIfStuck();
      bumpIdle();
      return;
    }
    SFX.hint();
    h.forEach(({r,c}) => {
      const el = getTileEl(r,c);
      if(!el) return;
      el.classList.add('hint');
      setTimeout(() => el.classList.remove('hint'), 1300);
    });
    bumpIdle(); // keep gently nudging every few seconds while still idle
  }

  async function autoReshuffleIfStuck(){
    if(hasAnyMove(grid)) return false;
    busy = true;
    SFX.shuffle();
    showToast('No more moves — reshuffling! 🔀');
    await wait(500);
    grid = buildInitialGrid();
    render();
    const tiles = boardEl.querySelectorAll('.tile');
    tiles.forEach(t => t.classList.add('spawning'));
    await wait(300);
    tiles.forEach(t => t.classList.remove('spawning'));
    busy = false;
    return true;
  }

  function wait(ms){ return new Promise(res => setTimeout(res, ms)); }

  function endGame(won){
    busy = true;
    const earnedStars = won ? starsForScore(currentLevel, score) : 0;
    const modalCard = document.getElementById('modalCard');
    modalCard.classList.remove('celebrate');
    if(won){
      SFX.win();
      const victoryWord = earnedStars >= 3 ? 'Sugar Rush!' : (earnedStars === 2 ? 'Delicious!' : 'Sweet!');
      showComboSplash(victoryWord, 1100);
      speak(victoryWord + (earnedStars >= 3 ? ' Incredible!' : ' Level complete!'), {pitch:1.4, rate:1.0});
      launchConfetti(earnedStars >= 3);
      setTimeout(() => launchConfetti(false), 300);
      setTimeout(() => launchConfetti(earnedStars >= 3), 650);
      modalTitle.textContent = 'Level Complete!';
      modalText.textContent = `Sweet! You scored ${score} (goal was ${goal}).`;
      modalBtn.textContent = 'Next Level';
      modalBtn.style.display = '';
      modalCard.classList.add('celebrate');
      const prevStars = save.stars[currentLevel] || 0;
      save.stars[currentLevel] = Math.max(prevStars, earnedStars);
      save.bestScore[currentLevel] = Math.max(save.bestScore[currentLevel] || 0, score);
      if(currentLevel + 1 > save.unlockedLevel) save.unlockedLevel = currentLevel + 1;
      persistSave();
    } else {
      SFX.lose();
      modalTitle.textContent = 'Out of Moves';
      modalText.textContent = `You reached ${score} points. The goal was ${goal}. Try again!`;
      modalBtn.textContent = 'Retry Level';
    }
    modalStars.innerHTML = [1,2,3].map(n => `<span class="${n<=earnedStars?'on':'off'}">★</span>`).join('');
    overlay.classList.add('show');

    modalBtn.onclick = () => {
      overlay.classList.remove('show');
      if(won){ startLevel(currentLevel + 1); }
      else { startLevel(currentLevel); }
    };
    modalMapBtn.onclick = () => {
      overlay.classList.remove('show');
      showMap();
    };
  }

  restartBtn.addEventListener('click', () => {
    if(!confirm('Restart the current level? Your score for this level will reset.')) return;
    startLevel(currentLevel);
  });
  backBtn.addEventListener('click', () => { showMap(); });

  function startLevel(n){
    clearIdleHint();
    currentLevel = n;
    const cfg = levelConfig(n);
    goal = cfg.goal;
    moves = cfg.moves;
    score = 0;
    levelNumEl.textContent = n;
    grid = buildInitialGrid();
    mapScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    render();
    busy = false;
    SFX.ready();
    autoReshuffleIfStuck();
    bumpIdle();
  }

  // ---------------- Level map ----------------
  function showMap(){
    clearIdleHint();
    gameScreen.classList.add('hidden');
    mapScreen.classList.remove('hidden');
    renderMap();
  }

  function renderMap(){
    levelPathEl.innerHTML = '';
    const maxShown = save.unlockedLevel + 3;
    const rows = [];
    for(let n=1; n<=maxShown; n++){
      const row = document.createElement('div');
      const pos = ((n-1) % 3) + 1; // zigzag 1,2,3,1,2,3...
      row.className = 'level-node-row pos-' + pos;

      const btn = document.createElement('button');
      const locked = n > save.unlockedLevel;
      const current = n === save.unlockedLevel;
      btn.className = 'level-node' + (locked ? ' locked' : '') + (current ? ' current' : '');
      btn.dataset.level = n;

      if(locked){
        btn.innerHTML = '<span class="lock-icon">🔒</span>';
      } else {
        const earned = save.stars[n] || 0;
        btn.innerHTML = String(n) +
          '<span class="stars">' + [1,2,3].map(s => `<span class="${s<=earned?'on':'off'}">★</span>`).join('') + '</span>';
        btn.addEventListener('click', () => startLevel(n));
      }
      row.appendChild(btn);
      levelPathEl.appendChild(row);
      rows.push(btn);
    }
    // draw connecting path line through node centers
    requestAnimationFrame(() => drawPathLine(rows));
  }

  function drawPathLine(nodeButtons){
    const svgNS = 'http://www.w3.org/2000/svg';
    const existing = levelPathEl.querySelector('svg.path-line');
    if(existing) existing.remove();
    if(nodeButtons.length < 2) return;
    const containerRect = levelPathEl.getBoundingClientRect();
    const pts = nodeButtons.map(btn => {
      const r = btn.getBoundingClientRect();
      return { x: r.left - containerRect.left + r.width/2, y: r.top - containerRect.top + r.height/2 };
    });
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'path-line');
    svg.setAttribute('width', levelPathEl.scrollWidth || containerRect.width);
    svg.setAttribute('height', levelPathEl.scrollHeight);
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++){
      const midY = (pts[i-1].y + pts[i].y) / 2;
      d += ` C ${pts[i-1].x} ${midY}, ${pts[i].x} ${midY}, ${pts[i].x} ${pts[i].y}`;
    }
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,201,60,0.7)');
    path.setAttribute('stroke-width', '5');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-dasharray', '2 14');
    svg.appendChild(path);
    levelPathEl.insertBefore(svg, levelPathEl.firstChild);
  }

  // init
  updateSoundIcons();
  showMap();

  function primeAudioOnce(){
    ensureAudio();
    document.removeEventListener('pointerdown', primeAudioOnce);
  }
  document.addEventListener('pointerdown', primeAudioOnce, {once:true});

  window.addEventListener('resize', () => {
    if(!mapScreen.classList.contains('hidden')){
      const btns = Array.from(levelPathEl.querySelectorAll('.level-node'));
      drawPathLine(btns);
    }
  });
})();
</script>
