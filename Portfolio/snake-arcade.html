<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE // ARCADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cabinet-maroon: #2a0e16;
            --cabinet-maroon-dark: #170710;
            --gold-trim: #d4a017;
            --gold-trim-dim: #7a5c14;
            --screen-black: #071510;
            --screen-black-2: #0c1f18;
            --phosphor: #3dff7a;
            --phosphor-dark: #14602f;
            --amber: #ffb627;
            --magenta: #ff3d81;
            --cream: #ede6d6;
            --cream-dim: #a89e8c;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0a0f 0%, #050203 100%);
            color: var(--cream);
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 14px;
        }

        .cabinet {
            width: min(520px, 100%);
            background: linear-gradient(180deg, var(--cabinet-maroon) 0%, var(--cabinet-maroon-dark) 100%);
            border: 3px solid var(--gold-trim-dim);
            border-radius: 22px;
            padding: 18px 18px 22px;
            box-shadow: 0 0 0 1px rgba(212,160,23,0.15), 0 30px 60px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
        }

        /* Marquee */
        .marquee {
            text-align: center;
            padding: 10px 6px 16px;
            border-bottom: 2px solid var(--gold-trim-dim);
            margin-bottom: 14px;
            position: relative;
        }

            .marquee h1 {
                font-family: 'Press Start 2P', monospace;
                font-size: clamp(20px, 6vw, 30px);
                margin: 0;
                letter-spacing: 2px;
                color: var(--phosphor);
                text-shadow: 0 0 6px rgba(61,255,122,0.85), 0 0 18px rgba(61,255,122,0.45), 0 0 34px rgba(61,255,122,0.25);
                animation: flicker 4.5s infinite;
            }

            .marquee .tagline {
                margin-top: 8px;
                font-size: 10px;
                letter-spacing: 3px;
                color: var(--gold-trim);
                text-transform: uppercase;
                opacity: 0.85;
            }

        @keyframes flicker {
            0%, 3%, 6%, 100% {
                opacity: 1;
            }

            4% {
                opacity: 0.72;
            }

            5% {
                opacity: 0.94;
            }

            52% {
                opacity: 1;
            }

            53% {
                opacity: 0.8;
            }

            54% {
                opacity: 1;
            }
        }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--cream-dim);
        }

            .hud .stat {
                text-align: center;
            }

                .hud .stat .label {
                    display: block;
                    color: var(--gold-trim);
                    margin-bottom: 6px;
                }

                .hud .stat .value {
                    color: var(--phosphor);
                    font-size: 14px;
                    text-shadow: 0 0 8px rgba(61,255,122,0.5);
                }

                .hud .stat.high .value {
                    color: var(--magenta);
                    text-shadow: 0 0 8px rgba(255,61,129,0.5);
                }

        /* Screen */
        .screen-frame {
            position: relative;
            background: var(--screen-black-2);
            border: 6px solid var(--cabinet-maroon-dark);
            border-radius: 10px;
            padding: 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.85), inset 0 0 2px rgba(0,0,0,0.9);
        }

        #board {
            display: block;
            width: 100%;
            height: auto;
            background: var(--screen-black);
            border-radius: 4px;
        }

        .scanlines {
            pointer-events: none;
            position: absolute;
            inset: 8px;
            border-radius: 4px;
            background: repeating-linear-gradient( to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px );
            mix-blend-mode: multiply;
        }

        .vignette {
            pointer-events: none;
            position: absolute;
            inset: 8px;
            border-radius: 4px;
            box-shadow: inset 0 0 60px 18px rgba(0,0,0,0.65);
        }

        /* Overlays */
        .overlay {
            position: absolute;
            inset: 8px;
            border-radius: 4px;
            background: rgba(4,10,8,0.86);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 14px;
            backdrop-filter: blur(1px);
        }

            .overlay.hidden {
                display: none;
            }

            .overlay h2 {
                font-family: 'Press Start 2P', monospace;
                font-size: clamp(14px, 5vw, 20px);
                color: var(--amber);
                text-shadow: 0 0 12px rgba(255,182,39,0.6);
                margin: 0;
                letter-spacing: 1px;
            }

            .overlay p {
                font-size: 11px;
                color: var(--cream-dim);
                line-height: 1.7;
                max-width: 320px;
                margin: 0;
            }

        .blink {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: var(--phosphor);
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--screen-black);
            background: linear-gradient(180deg, var(--phosphor) 0%, var(--phosphor-dark) 100%);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0b3d1e, 0 6px 14px rgba(0,0,0,0.5);
            transition: transform 0.08s ease;
        }

            .btn:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 #0b3d1e;
            }

        /* Controls */
        .controls {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
        }

        .dpad {
            display: grid;
            grid-template-columns: 46px 46px 46px;
            grid-template-rows: 46px 46px 46px;
            gap: 4px;
        }

            .dpad button {
                border: 1px solid var(--gold-trim-dim);
                background: linear-gradient(180deg, #3a1420 0%, #200a12 100%);
                color: var(--gold-trim);
                font-size: 16px;
                border-radius: 8px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 0 rgba(0,0,0,0.5);
            }

                .dpad button:active {
                    transform: translateY(2px);
                    box-shadow: none;
                }

            .dpad .up {
                grid-column: 2;
                grid-row: 1;
            }

            .dpad .left {
                grid-column: 1;
                grid-row: 2;
            }

            .dpad .ball {
                grid-column: 2;
                grid-row: 2;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 30%, #6a2436, #170710);
                border: 1px solid var(--gold-trim-dim);
            }

            .dpad .right {
                grid-column: 3;
                grid-row: 2;
            }

            .dpad .down {
                grid-column: 2;
                grid-row: 3;
            }

        .hint {
            font-size: 9px;
            color: var(--cream-dim);
            text-align: center;
            letter-spacing: 1px;
            max-width: 90px;
            line-height: 1.6;
        }

        @media (max-width: 420px) {
            .controls {
                gap: 16px;
            }

            .dpad {
                grid-template-columns: 40px 40px 40px;
                grid-template-rows: 40px 40px 40px;
            }
        }
    </style>
</head>
<body>

    <div class="cabinet">
        <div class="marquee">
            <h1>SNAKE</h1>
            <div class="tagline">Phosphor Arcade &middot; Est. 2026</div>
        </div>

        <div class="hud">
            <div class="stat">
                <span class="label">SCORE</span>
                <span class="value" id="score">000</span>
            </div>
            <div class="stat">
                <span class="label">LEVEL</span>
                <span class="value" id="level" style="color:var(--amber); text-shadow:0 0 8px rgba(255,182,39,0.5);">1</span>
            </div>
            <div class="stat high">
                <span class="label">HIGH</span>
                <span class="value" id="highScore">000</span>
            </div>
        </div>

        <div class="screen-frame">
            <canvas id="board"></canvas>
            <div class="scanlines"></div>
            <div class="vignette"></div>

            <div class="overlay" id="startOverlay">
                <h2>PRESS START</h2>
                <p>Arrow keys, WASD, swipe, or the joystick below. Eat the amber pulse, avoid the walls and your own tail.</p>
                <div class="blink">▶ INSERT COIN ◀</div>
                <button class="btn" id="startBtn">START GAME</button>
            </div>

            <div class="overlay hidden" id="overOverlay">
                <h2>GAME OVER</h2>
                <p id="finalScoreText">Score: 0</p>
                <button class="btn" id="restartBtn">PLAY AGAIN</button>
            </div>

            <div class="overlay hidden" id="pauseOverlay">
                <h2>PAUSED</h2>
                <button class="btn" id="resumeBtn">RESUME</button>
            </div>
        </div>

        <div class="controls">
            <div class="hint">TAP SCREEN<br>TO PAUSE</div>
            <div class="dpad">
                <button class="up" data-dir="up">▲</button>
                <button class="left" data-dir="left">◀</button>
                <div class="ball"></div>
                <button class="right" data-dir="right">▶</button>
                <button class="down" data-dir="down">▼</button>
            </div>
            <div class="hint">SWIPE OR<br>USE KEYS</div>
        </div>
    </div>

    <script>(() => {
  const COLS = 22, ROWS = 22;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const levelEl = document.getElementById('level');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScoreText = document.getElementById('finalScoreText');

  const HIGH_KEY = 'snakeArcadeHighScore';
  let highScore = parseInt(localStorage.getItem(HIGH_KEY) || '0', 10);
  highScoreEl.textContent = String(highScore).padStart(3, '0');

  let cellSize = 0;
  function resizeCanvas() {
    const frame = canvas.parentElement;
    const size = frame.clientWidth - 16; // account for frame padding
    canvas.width = size * devicePixelRatio;
    canvas.height = size * devicePixelRatio;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    cellSize = canvas.width / COLS;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  let snake, dir, nextDir, food, score, level, tickMs, acc, lastTime, state, foodPulse;

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{x: cx, y: cy}, {x: cx - 1, y: cy}, {x: cx - 2, y: cy}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    level = 1;
    tickMs = 140;
    acc = 0;
    lastTime = performance.now();
    foodPulse = 0;
    spawnFood();
    updateHud();
  }

  function spawnFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateHud() {
    scoreEl.textContent = String(score).padStart(3, '0');
    levelEl.textContent = String(level);
  }

  function setDirection(nx, ny) {
    if (state !== 'playing') return;
    if (nx === -dir.x && ny === -dir.y) return; // no reversing
    nextDir = { x: nx, y: ny };
  }

  const KEY_MAP = {
    ArrowUp: [0,-1], w: [0,-1], W: [0,-1],
    ArrowDown: [0,1], s: [0,1], S: [0,1],
    ArrowLeft: [-1,0], a: [-1,0], A: [-1,0],
    ArrowRight: [1,0], d: [1,0], D: [1,0],
  };

  window.addEventListener('keydown', (e) => {
    if (KEY_MAP[e.key]) {
      e.preventDefault();
      const [nx, ny] = KEY_MAP[e.key];
      setDirection(nx, ny);
    } else if (e.key === ' ' || e.key === 'Escape') {
      togglePause();
    }
  });

  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDirection(0,-1);
      if (d === 'down') setDirection(0,1);
      if (d === 'left') setDirection(-1,0);
      if (d === 'right') setDirection(1,0);
    });
  });

  // Swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const dt = Date.now() - touchStart.t;
    touchStart = null;
    if (dt > 600) return; // too slow, ignore
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      togglePause(); // tap = pause
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  });

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      pauseOverlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      lastTime = performance.now();
      pauseOverlay.classList.add('hidden');
      requestAnimationFrame(loop);
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  function startGame() {
    reset();
    state = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  function step() {
    dir = nextDir;
    const head = snake[0];
    const newHead = { x: head.x + dir.x, y: head.y + dir.y };

    const hitWall = newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS;
    const hitSelf = snake.some(s => s.x === newHead.x && s.y === newHead.y);

    if (hitWall || hitSelf) {
      endGame();
      return;
    }

    snake.unshift(newHead);

    if (newHead.x === food.x && newHead.y === food.y) {
      score += 10;
      if (score % 50 === 0) { level++; }
      tickMs = Math.max(70, tickMs - 2.5);
      spawnFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    state = 'gameover';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HIGH_KEY, String(highScore));
      highScoreEl.textContent = String(highScore).padStart(3, '0');
    }
    finalScoreText.textContent = `Score: ${score}   ·   Best: ${highScore}`;
    overOverlay.classList.remove('hidden');
  }

  function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, canvas.height);
      ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * cellSize);
      ctx.lineTo(canvas.width, j * cellSize);
      ctx.stroke();
    }

    // food (pulsing amber glow)
    foodPulse += 0.12;
    const pulse = (Math.sin(foodPulse) + 1) / 2; // 0..1
    const fx = food.x * cellSize + cellSize / 2;
    const fy = food.y * cellSize + cellSize / 2;
    const radius = cellSize * (0.28 + pulse * 0.10);
    const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius * 2.2);
    grad.addColorStop(0, 'rgba(255,182,39,0.95)');
    grad.addColorStop(0.5, 'rgba(255,182,39,0.35)');
    grad.addColorStop(1, 'rgba(255,182,39,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath();
    ctx.arc(fx, fy, radius, 0, Math.PI * 2);
    ctx.fill();

    // snake
    const n = snake.length;
    snake.forEach((seg, i) => {
      const t = i / Math.max(1, n - 1);
      const r = Math.round(61 + (20 - 61) * t);
      const g = Math.round(255 + (96 - 255) * t);
      const b = Math.round(122 + (47 - 122) * t);
      const x = seg.x * cellSize;
      const y = seg.y * cellSize;
      const pad = cellSize * 0.08;

      ctx.fillStyle = `rgb(${r},${g},${b})`;
      if (i === 0) {
        ctx.shadowColor = 'rgba(61,255,122,0.9)';
        ctx.shadowBlur = cellSize * 0.6;
      } else {
        ctx.shadowBlur = 0;
      }
      roundRect(ctx, x + pad, y + pad, cellSize - pad * 2, cellSize - pad * 2, cellSize * 0.22);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (i === 0) {
        // eyes
        ctx.fillStyle = '#07150f';
        const eyeOffset = cellSize * 0.2;
        const eyeR = cellSize * 0.07;
        let ex1, ey1, ex2, ey2;
        const cxp = x + cellSize / 2, cyp = y + cellSize / 2;
        if (dir.x === 1) { ex1=cxp+eyeOffset; ey1=cyp-eyeOffset; ex2=cxp+eyeOffset; ey2=cyp+eyeOffset; }
        else if (dir.x === -1) { ex1=cxp-eyeOffset; ey1=cyp-eyeOffset; ex2=cxp-eyeOffset; ey2=cyp+eyeOffset; }
        else if (dir.y === 1) { ex1=cxp-eyeOffset; ey1=cyp+eyeOffset; ex2=cxp+eyeOffset; ey2=cyp+eyeOffset; }
        else { ex1=cxp-eyeOffset; ey1=cyp-eyeOffset; ex2=cxp+eyeOffset; ey2=cyp-eyeOffset; }
        ctx.beginPath(); ctx.arc(ex1, ey1, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, eyeR, 0, Math.PI*2); ctx.fill();
      }
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(time) {
    if (state !== 'playing') return;
    const dt = time - lastTime;
    lastTime = time;
    acc += dt;

    while (acc >= tickMs) {
      step();
      acc -= tickMs;
      if (state !== 'playing') break;
    }

    draw(time);
    if (state === 'playing') requestAnimationFrame(loop);
  }

  resizeCanvas();
  state = 'idle';
  reset();
  draw(0);
})();</script>
</body>
</html>
